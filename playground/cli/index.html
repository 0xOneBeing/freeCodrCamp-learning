<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linux Terminal-like CLI</title>
    <style>
      body {
        font-family: "Courier New", monospace;
        margin: 0;
        background-color: #000;
        color: #fff;
        overflow: hidden;
      }

      #terminal {
        width: 100%;
        height: 100vh;
        overflow-y: auto;
        padding: 20px;
        box-sizing: border-box;
      }

      #prompt {
        color: #00ff00;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>

    <script>
      const terminal = document.getElementById("terminal");
      const prompt = document.getElementById("prompt");
      let commandHistory = [];
      let commandIndex = 0;

      function writeOutput(text) {
        terminal.innerHTML += `<div>${text}</div>`;
        terminal.scrollTop = terminal.scrollHeight;
      }

      function executeCommand(command) {
        writeOutput(`<span id="prompt">user@linux:~$</span> ${command}`);

        let output = "";

        switch (command.trim()) {
          case "help":
            output =
              "Available commands:\n- help: Show this help message\n- greet: Greet the user\n- clear: Clear the console";
            break;
          case "greet":
            output = "Hello, user!";
            break;
          case "clear":
            terminal.innerHTML = "";
            return;
          default:
            output = `Command not recognized: ${command}\nType 'help' for a list of available commands.`;
        }

        writeOutput(output);
      }

      function handleInput(event) {
        if (event.key === "Enter") {
          const command = prompt.innerText.trim();
          prompt.innerText = "";

          if (command) {
            commandHistory.push(command);
            commandIndex = commandHistory.length;

            executeCommand(command);
          }
        } else if (event.key === "ArrowUp") {
          if (commandIndex > 0) {
            commandIndex--;
            prompt.innerText = commandHistory[commandIndex];
          }
        } else if (event.key === "ArrowDown") {
          if (commandIndex < commandHistory.length - 1) {
            commandIndex++;
            prompt.innerText = commandHistory[commandIndex];
          } else {
            commandIndex = commandHistory.length;
            prompt.innerText = "";
          }
        }
      }

      document.addEventListener("keydown", handleInput);
    </script>
  </body>
</html>
